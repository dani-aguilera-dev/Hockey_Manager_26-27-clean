[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["manager/saves", "jugadores", "tools/__pycache__", "manager/src/__pycache__"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["manager/src", "manager/web"]
omit = ["src/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true
